name: Castar release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    outputs:
      build-server: ${{ steps.plan.outputs.build_server }}
      server-tag: ${{ steps.plan.outputs.server_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/castar_release.py plan "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"

  windows-client:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Publish the Windows client and update package
        shell: pwsh
        run: |
          $version = dotnet msbuild Castar/Castar.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag must match Castar.csproj Version."
          }
          "CASTAR_VERSION=$version" >> $env:GITHUB_ENV
          $publishPath = Join-Path $env:RUNNER_TEMP 'castar-publish'
          dotnet publish Castar/Castar.csproj -c Release -r win-x64 --self-contained false -o $publishPath
          if ($LASTEXITCODE -ne 0) { throw "Castar client publish failed." }
          dotnet publish Castar.Updater/Castar.Updater.csproj -c Release -r win-x64 --self-contained false -o $publishPath
          if ($LASTEXITCODE -ne 0) { throw "Castar update helper publish failed." }

          $clientConfig = Get-Content -LiteralPath (Join-Path $publishPath 'Castar.runtimeconfig.json') -Raw | ConvertFrom-Json
          $helperConfig = Get-Content -LiteralPath (Join-Path $publishPath 'Castar.Updater.runtimeconfig.json') -Raw | ConvertFrom-Json
          $clientFrameworks = @($clientConfig.runtimeOptions.frameworks) + @($clientConfig.runtimeOptions.framework)
          $helperFrameworks = @($helperConfig.runtimeOptions.frameworks) + @($helperConfig.runtimeOptions.framework)
          if ('Microsoft.WindowsDesktop.App' -notin $clientFrameworks.name -or
              'Microsoft.NETCore.App' -notin $helperFrameworks.name) {
            throw "Castar and its update helper must use an installed runtime."
          }
          foreach ($runtimeFile in 'hostfxr.dll', 'hostpolicy.dll', 'coreclr.dll', 'System.Private.CoreLib.dll') {
            if (Test-Path -LiteralPath (Join-Path $publishPath $runtimeFile)) {
              throw "Unexpected embedded runtime file: $runtimeFile"
            }
          }

          $files = Get-ChildItem -LiteralPath $publishPath -File -Force -Recurse |
            ForEach-Object { [IO.Path]::GetRelativePath($publishPath, $_.FullName).Replace('\', '/') } |
            Sort-Object
          [IO.File]::WriteAllLines((Join-Path $publishPath 'Castar.UpdateFiles.txt'), [string[]]$files)
          $updateArchive = Join-Path $env:RUNNER_TEMP 'Castar-Update-win-x64.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($publishPath, $updateArchive)
      - name: Build the installer
        shell: pwsh
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerPath = Join-Path $env:RUNNER_TEMP 'inno'
          $publishPath = Join-Path $env:RUNNER_TEMP 'castar-publish'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw "Unexpected Inno Setup checksum."
          }
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$compilerPath`"" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed." }
          & (Join-Path $compilerPath 'ISCC.exe') "/DCastarVersion=$env:CASTAR_VERSION" "/DPublishDir=$publishPath" "/O$env:RUNNER_TEMP" installer/Castar.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          if (!(Test-Path (Join-Path $env:RUNNER_TEMP 'Castar-win-x64.exe'))) {
            throw "The installer file is missing."
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: castar-client-win-x64
          path: |
            ${{ runner.temp }}/Castar-win-x64.exe
            ${{ runner.temp }}/Castar-Update-win-x64.zip
          if-no-files-found: error

  server:
    needs: release-plan
    if: needs.release-plan.outputs.build-server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            archive: Castar-Server-win-x64.zip
          - os: ubuntu-24.04
            rid: linux-x64
            archive: Castar-Server-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: Castar-Server-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Publish and archive Castar Server
        shell: pwsh
        env:
          CASTAR_RID: ${{ matrix.rid }}
          CASTAR_ARCHIVE: ${{ matrix.archive }}
        run: |
          $version = dotnet msbuild Castar.Server/Castar.Server.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must match Castar.Server.csproj Version."
          }
          $publishPath = Join-Path $env:RUNNER_TEMP 'castar-server-publish'
          $archivePath = Join-Path $env:RUNNER_TEMP $env:CASTAR_ARCHIVE
          dotnet publish Castar.Server/Castar.Server.csproj -c Release -r $env:CASTAR_RID --self-contained -o $publishPath
          if ($LASTEXITCODE -ne 0) { throw "Castar Server publish failed." }
          Copy-Item -LiteralPath Castar.Server/DEPLOYMENT.md -Destination $publishPath
          if ($IsWindows) {
            [IO.Compression.ZipFile]::CreateFromDirectory($publishPath, $archivePath)
          } else {
            tar -czf $archivePath -C $publishPath .
            if ($LASTEXITCODE -ne 0) { throw "Castar Server archive creation failed." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: castar-server-${{ matrix.rid }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [release-plan, windows-client, server]
    if: >-
      ${{ !cancelled() && needs.release-plan.result == 'success' && needs.windows-client.result == 'success'
          && (needs.server.result == 'success' || needs.server.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: castar-*
          merge-multiple: true
          path: release-assets
      - name: Attach verified packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ needs.release-plan.outputs.server-tag }}
        run: python3 .github/scripts/castar_release.py draft "$GITHUB_REF_NAME" release-assets "$SERVER_TAG"
