name: Castar release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Publish Castar
        shell: pwsh
        run: |
          $version = dotnet msbuild Castar/Castar.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag must match Castar.csproj Version."
          }
          "CASTAR_VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish Castar/Castar.csproj -c Release -r win-x64 --self-contained -o "${{ runner.temp }}/castar-publish"
      - name: Build and verify the installer
        shell: pwsh
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerPath = Join-Path $env:RUNNER_TEMP 'inno'
          $publishPath = Join-Path $env:RUNNER_TEMP 'castar-publish'
          $installPath = Join-Path $env:RUNNER_TEMP 'castar-smoke'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw "Unexpected Inno Setup checksum."
          }
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$compilerPath`"" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed." }
          & (Join-Path $compilerPath 'ISCC.exe') "/DCastarVersion=$env:CASTAR_VERSION" "/DPublishDir=$publishPath" "/O$env:RUNNER_TEMP" installer/Castar.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          $installer = Join-Path $env:RUNNER_TEMP 'Castar-Setup-win-x64.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installPath`"" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path (Join-Path $installPath 'Castar.exe'))) {
            throw "Castar installer smoke test failed."
          }
          $fileVersion = (Get-Item (Join-Path $installPath 'Castar.exe')).VersionInfo.ProductVersion
          if ($fileVersion.Split('+')[0] -ne $env:CASTAR_VERSION) {
            throw "Installed executable version does not match the release."
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: castar-client-win-x64
          path: ${{ runner.temp }}/Castar-Setup-win-x64.exe
          if-no-files-found: error

  server:
    strategy:
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            archive: Castar-Server-win-x64.zip
            executable: Castar.Server.exe
          - os: ubuntu-24.04
            rid: linux-x64
            archive: Castar-Server-linux-x64.tar.gz
            executable: Castar.Server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: global.json
      - name: Publish and archive Castar Server
        shell: pwsh
        env:
          CASTAR_RID: ${{ matrix.rid }}
          CASTAR_ARCHIVE: ${{ matrix.archive }}
        run: |
          $version = dotnet msbuild Castar.Server/Castar.Server.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The tag must match Castar.Server.csproj Version."
          }
          $publishPath = Join-Path $env:RUNNER_TEMP 'castar-server-publish'
          $archivePath = Join-Path $env:RUNNER_TEMP $env:CASTAR_ARCHIVE
          dotnet publish Castar.Server/Castar.Server.csproj -c Release -r $env:CASTAR_RID --self-contained -o $publishPath
          if ($LASTEXITCODE -ne 0) { throw "Castar Server publish failed." }
          if (!(Test-Path (Join-Path $publishPath 'DataBase/UpgradeCastar.sql'))) {
            throw "Castar Server publish is missing the SQL Server schema script."
          }
          Copy-Item -LiteralPath Castar.Server/DEPLOYMENT.md -Destination $publishPath
          if ($IsWindows) {
            [IO.Compression.ZipFile]::CreateFromDirectory($publishPath, $archivePath)
          } else {
            tar -czf $archivePath -C $publishPath .
            if ($LASTEXITCODE -ne 0) { throw "Castar Server archive creation failed." }
          }
      - name: Verify the packaged server
        shell: pwsh
        env:
          CASTAR_ARCHIVE: ${{ matrix.archive }}
          CASTAR_EXECUTABLE: ${{ matrix.executable }}
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP $env:CASTAR_ARCHIVE
          $smokePath = Join-Path $env:RUNNER_TEMP 'castar-server-smoke'
          if ($IsWindows) {
            [IO.Compression.ZipFile]::ExtractToDirectory($archivePath, $smokePath)
          } else {
            New-Item -ItemType Directory -Path $smokePath | Out-Null
            tar -xzf $archivePath -C $smokePath
            if ($LASTEXITCODE -ne 0) { throw "Castar Server archive extraction failed." }
          }
          $env:Castar__ApiKey = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:Castar__Telegram__Enabled = 'false'
          $env:Database__Engine = 'Sqlite'
          $env:Database__SqlitePath = Join-Path $smokePath 'castar-smoke.sqlite'
          $env:ASPNETCORE_URLS = 'http://127.0.0.1:5080'
          $stdout = Join-Path $env:RUNNER_TEMP 'castar-server.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'castar-server.stderr.log'
          $processArgs = @{
            FilePath = Join-Path $smokePath $env:CASTAR_EXECUTABLE
            WorkingDirectory = $smokePath
            RedirectStandardOutput = $stdout
            RedirectStandardError = $stderr
            PassThru = $true
          }
          if ($IsWindows) { $processArgs.WindowStyle = 'Hidden' }
          $server = Start-Process @processArgs
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30 -and !$server.HasExited; $attempt++) {
              try {
                $health = Invoke-WebRequest "$env:ASPNETCORE_URLS/health" -TimeoutSec 2 -SkipHttpErrorCheck
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The port may not be listening during startup.
              }
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw "The packaged Castar Server did not become healthy." }

            $unauthorized = Invoke-WebRequest "$env:ASPNETCORE_URLS/api/users" -TimeoutSec 5 -SkipHttpErrorCheck
            if ($unauthorized.StatusCode -ne 401) {
              throw "The packaged Castar Server did not reject a request without a Bearer token."
            }
            $headers = @{ Authorization = "Bearer $env:Castar__ApiKey" }
            $users = Invoke-WebRequest "$env:ASPNETCORE_URLS/api/users" -Headers $headers -TimeoutSec 5
            $records = ConvertFrom-Json -InputObject $users.Content -NoEnumerate
            if ($records -isnot [array] -or $records.Count -ne 0) {
              throw "The packaged Castar Server did not return an empty database."
            }
          } catch {
            Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
            throw
          } finally {
            if (!$server.HasExited) { $server.Kill($true) }
            $server.Dispose()
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: castar-server-${{ matrix.rid }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [windows-client, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: castar-*
          merge-multiple: true
          path: release-assets
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/Castar-Setup-win-x64.exe \
            release-assets/Castar-Server-win-x64.zip \
            release-assets/Castar-Server-linux-x64.tar.gz \
            --verify-tag --latest --title "Castar ${GITHUB_REF_NAME#v}" --notes-file installer/ReleaseNotes.md
